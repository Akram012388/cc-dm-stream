[package]
name = "cc-dm-stream"
version = "0.1.0"
edition = "2021"
description = "Live streaming TUI for the cc-dm coordination bus"
license = "MIT"
repository = "https://github.com/Akram012388/cc-dm-stream"
keywords = ["cc-dm", "tui", "terminal", "claude-code"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "0.30.0", features = ["crossterm"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
notify = "8.2.0"
clap = { version = "4", features = ["derive"] }
dirs = "6"
chrono = "0.4"

[profile.release]
lto = true
strip = true
codegen-units = 1
