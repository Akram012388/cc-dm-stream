name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$BUILD_TARGET"

      - name: Rename binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cp "target/${BUILD_TARGET}/release/cc-dm-stream" "cc-dm-stream-${BUILD_TARGET}"

      - name: Generate SHA256 checksum
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          shasum -a 256 "cc-dm-stream-${BUILD_TARGET}" > "cc-dm-stream-${BUILD_TARGET}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cc-dm-stream-${{ matrix.target }}
          path: |
            cc-dm-stream-${{ matrix.target }}
            cc-dm-stream-${{ matrix.target }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create checksums file
        run: |
          cat *.sha256 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cc-dm-stream-*
            checksums.txt
